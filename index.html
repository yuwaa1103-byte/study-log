<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111"><title>STUDY LOG</title>
<style>
:root{color-scheme:light;--ink:#111;--muted:#777;--line:#e6e6e6;--paper:#fff;--soft:#f5f5f5}*{box-sizing:border-box}body{margin:0;background:#f1f1f1;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:560px;min-height:100dvh;margin:auto;background:var(--paper);padding:calc(18px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));}.top{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:18px}.logo{width:48px;height:48px;background:#111;color:white;border-radius:12px;display:grid;place-items:center;font-size:23px}.brand{font-weight:850;letter-spacing:1.6px;font-size:21px}.sub{font-size:10px;color:var(--muted);letter-spacing:1.5px;margin-top:3px}.date-row{display:flex;align-items:center;justify-content:space-between;margin:24px 0 16px}.eyebrow{font-size:11px;color:var(--muted);letter-spacing:1.4px}.date{font-size:24px;font-weight:800;margin-top:5px}.dateinput{max-width:145px;border:1px solid var(--line);border-radius:10px;padding:9px;background:white}.progress{border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:25px}.prow{display:flex;justify-content:space-between;align-items:center}.pct{font-size:32px;font-weight:800}.bar{height:8px;border-radius:9px;background:#e9e9e9;overflow:hidden;margin:12px 0 9px}.fill{height:100%;width:0;background:#111;transition:width .2s}.muted{color:var(--muted);font-size:12px}.section-title{font-size:17px;font-weight:800;margin:0 0 13px}.form{display:grid;grid-template-columns:105px 1fr;gap:9px}.field{min-width:0;width:100%;border:1px solid #dcdcdc;border-radius:10px;padding:12px;background:#fff;color:#111}.add{grid-column:1/-1;background:#111;color:white;border:0;border-radius:10px;padding:13px;font-weight:700}.listhead{display:flex;align-items:center;justify-content:space-between;margin:27px 0 14px}.group{margin-bottom:18px}.ghead{display:flex;align-items:center;gap:9px;margin-bottom:8px}.tag{background:#eee;border-radius:6px;padding:5px 9px;font-size:12px;font-weight:700}.gline{height:1px;background:var(--line);flex:1}.gcount{font-size:11px;color:var(--muted)}.task{border:1px solid var(--line);border-radius:11px;padding:12px;display:flex;gap:10px;align-items:center;margin-bottom:7px}.task input{width:20px;height:20px;accent-color:#111;flex-shrink:0}.tasktext{flex:1;overflow-wrap:anywhere;font-size:14px;line-height:1.4}.task.done .tasktext{color:#888;text-decoration:line-through}.del{border:0;background:transparent;color:#888;font-size:20px;padding:0 3px}.empty{background:var(--soft);border-radius:14px;text-align:center;padding:30px 18px;color:var(--muted);font-size:13px;line-height:1.8}.foot{margin-top:28px;border-top:1px solid var(--line);padding-top:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.smallbtn{background:white;border:1px solid #ddd;border-radius:9px;padding:10px 12px;font-size:12px}.notice{font-size:11px;color:#888;text-align:center;margin-top:15px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:white;padding:10px 16px;border-radius:20px;font-size:12px;display:none}
</style></head><body><main class="app">
<header class="top"><div class="logo">▤</div><div><div class="brand">STUDY LOG</div><div class="sub">MY DAILY STUDY PLANNER</div></div></header>
<div class="date-row"><div><div class="eyebrow">DAILY PLAN</div><div class="date" id="dayLabel">今日の勉強</div></div><input class="dateinput" type="date" id="datePick" aria-label="日付を選ぶ"></div>
<section class="progress"><div class="prow"><strong>今日の達成率</strong><div class="pct" id="pct">0%</div></div><div class="bar"><div class="fill" id="fill"></div></div><div class="prow muted"><span id="count">完了 0 / 0 件</span><span id="message">自分のペースでOK</span></div></section>
<section><h2 class="section-title">＋ 勉強を追加</h2><form class="form" id="taskForm"><select class="field" id="subject" aria-label="教科"><option>国語</option><option selected>数学</option><option>英語</option><option>理科</option><option>社会</option><option>美術</option><option>保体</option><option>技家</option><option>音楽</option></select><input class="field" id="taskInput" maxlength="120" placeholder="例：数学のワークを5ページ" required><button class="add" type="submit">＋ 予定を追加する</button></form></section>
<div class="listhead"><h2 class="section-title" style="margin:0">今日のチェックリスト</h2><span class="muted" id="totalLabel">0 tasks</span></div><section id="taskList"></section>
<footer class="foot"><button class="smallbtn" id="clearDone">完了した予定を削除</button><button class="smallbtn" id="clearDay">この日の予定をリセット</button></footer><div class="notice">予定はこのブラウザに自動保存されるよ。日付を変えると別の日の予定を管理できます。</div>
</main><div class="toast" id="toast"></div>
<script>
const subjects=['国語','数学','英語','理科','社会','美術','保体','技家','音楽'];
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let selectedDate=today();let data={};try{data=JSON.parse(localStorage.getItem('studylog-data-v1')||'{}')||{}}catch(e){data={}};
const $=id=>document.getElementById(id);$('datePick').value=selectedDate;
function save(){try{localStorage.setItem('studylog-data-v1',JSON.stringify(data))}catch(e){toast('保存できませんでした。ブラウザの空き容量を確認してね。')}}
function tasks(){return data[selectedDate]||(data[selectedDate]=[])}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)}
function render(){const list=tasks();const done=list.filter(t=>t.done).length;const pct=list.length?Math.round(done/list.length*100):0;$('pct').textContent=pct+'%';$('fill').style.width=pct+'%';$('count').textContent=`完了 ${done} / ${list.length} 件`;$('totalLabel').textContent=`${list.length} tasks`;$('message').textContent=list.length&&done===list.length?'全部完了！':list.length?'自分のペースでOK':'まずは1つ登録しよう';$('dayLabel').textContent=selectedDate===today()?'今日の勉強':`${Number(selectedDate.slice(5,7))}月${Number(selectedDate.slice(8,10))}日の勉強`;
const root=$('taskList');root.innerHTML='';if(!list.length){root.innerHTML='<div class="empty">▤<br>予定はまだ空っぽ<br>教科と勉強内容を入力して、最初の予定を追加してみよう！</div>';return}
subjects.forEach(sub=>{const items=list.filter(t=>t.subject===sub);if(!items.length)return;const group=document.createElement('div');group.className='group';const head=document.createElement('div');head.className='ghead';const tag=document.createElement('span');tag.className='tag';tag.textContent=sub;const line=document.createElement('div');line.className='gline';const count=document.createElement('span');count.className='gcount';count.textContent=`${items.filter(t=>t.done).length}/${items.length}`;head.append(tag,line,count);group.append(head);items.forEach(t=>{const row=document.createElement('div');row.className='task'+(t.done?' done':'');const cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;cb.setAttribute('aria-label',t.text+' 完了');cb.addEventListener('change',()=>{t.done=cb.checked;save();render()});const text=document.createElement('div');text.className='tasktext';text.textContent=t.text;const del=document.createElement('button');del.className='del';del.type='button';del.textContent='×';del.setAttribute('aria-label','予定を削除');del.addEventListener('click',()=>{data[selectedDate]=tasks().filter(x=>x.id!==t.id);save();render()});row.append(cb,text,del);group.append(row)});root.append(group)})}
$('taskForm').addEventListener('submit',e=>{e.preventDefault();const text=$('taskInput').value.trim();if(!text)return;tasks().push({id:Date.now()+Math.random(),subject:$('subject').value,text,done:false});$('taskInput').value='';save();render();toast('予定を追加したよ！')});
$('datePick').addEventListener('change',e=>{if(!e.target.value)return;selectedDate=e.target.value;render()});
$('clearDone').addEventListener('click',()=>{const before=tasks().length;data[selectedDate]=tasks().filter(t=>!t.done);save();render();toast(before===tasks().length?'完了した予定はまだないよ':'完了した予定を削除したよ')});
$('clearDay').addEventListener('click',()=>{if(!tasks().length){toast('この日の予定は空だよ');return}if(confirm('この日の予定を全部削除する？')){data[selectedDate]=[];save();render();toast('予定をリセットしたよ')}});
render();
</script></body></html>
